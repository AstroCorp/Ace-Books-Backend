allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  unrs-resolver: true

# @nestjs/platform-fastify trae su propia copia de Fastify, con esto evitamos conflictos
overrides:
  fastify: 5.12.7

minimumReleaseAgeExclude:
  - '@css-inline/css-inline-android-arm-eabi@0.22.1'
  - '@css-inline/css-inline-android-arm64@0.22.1'
  - '@css-inline/css-inline-darwin-arm64@0.22.1'
  - '@css-inline/css-inline-darwin-x64@0.22.1'
  - '@css-inline/css-inline-linux-arm-gnueabihf@0.22.1'
  - '@css-inline/css-inline-linux-arm64-gnu@0.22.1'
  - '@css-inline/css-inline-linux-arm64-musl@0.22.1'
  - '@css-inline/css-inline-linux-x64-gnu@0.22.1'
  - '@css-inline/css-inline-linux-x64-musl@0.22.1'
  - '@css-inline/css-inline-win32-arm64-msvc@0.22.1'
  - '@css-inline/css-inline-win32-x64-msvc@0.22.1'
  - '@css-inline/css-inline@0.22.1'
  - '@fastify/helmet@13.2.0'
  - '@vercel/blob@2.8.2'
  - nodemailer@10.1.1
